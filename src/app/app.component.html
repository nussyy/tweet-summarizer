<!-- src/app/app.component.html -->
<div class="container">
  <h1>Tweet Summarizer <span class="ai-icon">✨</span></h1>
  <p>Enter text below to get an AI-generated summary.</p>

  <!-- Input Area -->
  <div class="input-area">
    <textarea
      [(ngModel)]="tweetContent"
      rows="6"
      placeholder="Paste text here..."
      aria-label="Text input for summarization"
      [disabled]="isLoading"> <!-- <<< REMOVE ngSkipHydration from here >>> -->
    </textarea>
  </div>

  <button
  (click)="getSummary()"
  [disabled]="!tweetContent || !tweetContent.trim() || isLoading"
  class="summarize-button">
  <!-- Show different text based on loading state -->
  <span *ngIf="!isLoading">Summarize</span>
  <span *ngIf="isLoading">Summarizing...</span>
</button>

<!-- Loading Indicator -->
<div *ngIf="isLoading" class="loading-indicator" aria-live="polite">
  <p>🧠 Contacting AI model...</p>
</div>

<!-- Summary Display Area -->
<div *ngIf="summary && !isLoading" class="summary-output" aria-live="polite">
  <h2>Summary:</h2>
  <p>{{ summary }}</p>
</div>

<!-- Error Display Area -->
<div *ngIf="errorMessage && !isLoading" class="error-message" role="alert">
  <h2>Error:</h2>
  <p>{{ errorMessage }}</p>
</div>



</div>
